# Production (VPS Datacloud). Les secrets viennent de deploy/.env (jamais commité).
# Les ${...} ci-dessous sont lus dans le .env de la racine, pas dans deploy/.env :
# d'où le lien symbolique `ln -s deploy/.env .env` (deploy/README.md, étape 6).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-devlink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD introuvable, lancer « ln -s deploy/.env .env » à la racine (deploy/README.md, étape 6)}
      POSTGRES_DB: ${DB_NAME:-devlink}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devlink}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: deploy/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: unless-stopped

volumes:
  pg_data:
