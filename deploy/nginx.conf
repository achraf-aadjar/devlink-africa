# DOMAINE : remplacer example.org par le nom de domaine réel avant le déploiement.

server {
    listen 80;
    server_name example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.org;

    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité (DL-29). Django en pose déjà une partie ; nginx les
    # applique aussi aux fichiers statiques, qui ne passent pas par Django.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Politique de sécurité du contenu. Elle est stricte parce que nous n'avons
    # aucune dépendance externe : ni police distante, ni script tiers, ni CDN.
    # `connect-src 'self'` : l'application ne parle qu'à sa propre API.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Taille maximale d'une requête : cohérente avec le réglage Django.
    client_max_body_size 3m;

    # API, admin et schéma servis par Gunicorn (service "backend").
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application React : repli sur index.html pour le routage côté client.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
