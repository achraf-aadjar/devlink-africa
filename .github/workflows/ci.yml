name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devlink
          POSTGRES_PASSWORD: devlink
          POSTGRES_DB: devlink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py check
        env:
          SECRET_KEY: ci-only
          DEBUG: "True"
          DB_PASSWORD: devlink
      - run: python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: ci-only
          DEBUG: "True"
          DB_PASSWORD: devlink
      - run: pytest
      - run: pytest
        env:
          DB_ENGINE: postgresql
          DB_PASSWORD: devlink
          DB_HOST: 127.0.0.1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: PYTHON=python scripts/check_licenses.sh all
