name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devlink
          POSTGRES_PASSWORD: devlink
          POSTGRES_DB: devlink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "True"
      DB_PASSWORD: devlink
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Lint et format (ruff)
        run: ruff check . && ruff format --check .

      - name: Contrôles Django
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Schéma OpenAPI sans avertissement
        run: python manage.py spectacular --file /tmp/schema.yml --fail-on-warn

      - name: Tests sur SQLite
        run: pytest

      - name: Tests sur PostgreSQL
        env:
          DB_ENGINE: postgresql
        run: pytest

      # Seuils imposés par le cahier des charges : 85 % global, 90 % sur le
      # matching et les services. Ne jamais les baisser pour faire passer la CI.
      - name: Couverture
        env:
          DB_ENGINE: postgresql
        run: |
          coverage run -m pytest
          coverage report --fail-under=85
          coverage report --fail-under=90 --include="*/matching/*,*/services.py"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint sans avertissement, Prettier)
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Le parcours de démonstration (docs/demo.md) rejoué dans Chromium : si ce
  # job échoue, la démonstration devant le jury est cassée.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - name: Navigateur Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Parcours de démonstration
        run: npx playwright test
        working-directory: e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: e2e/playwright-report
          retention-days: 7

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - name: Licences Python et Node (aucune GPL, AGPL, LGPL ni MPL)
        run: PYTHON=python scripts/check_licenses.sh all

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recherche de secrets commités
        run: scripts/check_secrets.sh
